[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "report-service"
version = "0.1.0"
description = "FastAPI report search service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["reports_app*"]
